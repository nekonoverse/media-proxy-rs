# cargo-about configuration. This produces the Rust dependency section of
# THIRD-PARTY-NOTICES.md; bundled non-Rust components are appended by
# scripts/generate-third-party-notices.sh.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

ignore-dev-dependencies = true
private = { ignore = true }
