name: Security Audit

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - 'about.toml'
      - 'third-party-notices.hbs'
      - 'third-party-notices-extra.md'
      - 'scripts/generate-third-party-notices.sh'
      - 'THIRD-PARTY-NOTICES.md'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - 'about.toml'
      - 'third-party-notices.hbs'
      - 'third-party-notices-extra.md'
      - 'scripts/generate-third-party-notices.sh'
      - 'THIRD-PARTY-NOTICES.md'
  schedule:
    - cron: '0 16 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: dependency security and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cargo generate-lockfile
      - run: cargo install cargo-audit
      - run: cargo audit --ignore RUSTSEC-2024-0436
      - run: cargo install cargo-deny --version 0.18.4 --locked
      - run: cargo deny check licenses
      - run: cargo install cargo-about --version 0.8.4 --locked
      - run: scripts/generate-third-party-notices.sh
      - run: git diff --exit-code -- THIRD-PARTY-NOTICES.md
